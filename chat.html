<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Guide | GO HERITAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --orange: #E8651A;
            --dark: #080C12;
            --dark2: #0D1420;
            --glass: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text: #F0EDE8;
            --muted: rgba(240, 237, 232, 0.55);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--dark);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--dark2);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        header a {
            color: var(--orange);
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 24px;
            letter-spacing: 2px;
            color: var(--text);
        }

        #chatbot {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            background: var(--dark2);
        }

        .chatbot-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-msg {
            font-size: 13px;
            line-height: 1.5;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
        }

        .chat-msg.bot {
            background: var(--glass);
            color: var(--text);
            border: 1px solid var(--glass-border);
            align-self: flex-start;
            border-radius: 2px 12px 12px 12px;
        }

        .chat-msg.user {
            background: var(--orange);
            color: #fff;
            align-self: flex-end;
            border-radius: 12px 2px 12px 12px;
        }

        .chatbot-input {
            display: flex;
            border-top: 1px solid var(--glass-border);
            padding: 12px;
            gap: 8px;
        }

        .chatbot-input input {
            flex: 1;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text);
            padding: 10px 12px;
            font-size: 14px;
            font-family: 'DM Sans', sans-serif;
            outline: none;
            border-radius: 2px;
        }

        .chatbot-input button {
            background: var(--orange);
            color: #fff;
            border: none;
            padding: 10px 16px;
            cursor: pointer;
            font-size: 14px;
            border-radius: 2px;
        }
    </style>
</head>
<body>
    <header>
        <a href="go-heritage.html">Back</a>
        <h1>AI TRAVEL GUIDE</h1>
    </header>

    <div id="chatbot">
        <div class="chatbot-messages" id="chatMessages">
            <div class="chat-msg bot">Namaskara! Ask me about GO HERITAGE, packages, hotels, city pages, or travel information.</div>
        </div>
        <div class="chatbot-input">
            <input type="text" id="chatInput" placeholder="Ask about GO HERITAGE..." onkeydown="if(event.key==='Enter')sendChat()">
            <button onclick="sendChat()">Send</button>
        </div>
    </div>

    <script>
        async function sendChat() {
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            const msgs = document.getElementById('chatMessages');
            msgs.innerHTML += `<div class="chat-msg user">${msg}</div>`;
            input.value = '';

            const replyId = 'chatReply' + Date.now();
            msgs.innerHTML += `<div class="chat-msg bot" id="${replyId}">Thinking...</div>`;
            msgs.scrollTop = msgs.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: msg })
                });
                const data = await response.json();
                const reply = document.getElementById(replyId);
                if (reply) reply.textContent = data.reply || 'No reply received.';
            } catch (error) {
                const reply = document.getElementById(replyId);
                if (reply) reply.textContent = 'AI connection error.';
            }

            msgs.scrollTop = msgs.scrollHeight;
        }
    </script>
</body>
</html>
