<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Map — GO HERITAGE</title>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
    <link rel="stylesheet" href="responsive.css">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; background: #0B0B0F; color: #EDEEF2; font-family: 'DM Sans', sans-serif; overflow: hidden; }
        #map { width: 100%; height: 100%; position: fixed; inset: 0; }
        .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; padding: 18px 28px; background: rgba(11,11,15,0.74); backdrop-filter: blur(18px) saturate(1.4); border-bottom: 1px solid rgba(212,168,67,0.18); }
        .topbar a { color: #EDEEF2; text-decoration: none; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; }
        .topbar .title { font-family: 'Fraunces', serif; font-size: 18px; letter-spacing: 1px; text-transform: uppercase; }
        .topbar .title span { color: #D4A843; }
        .panel { position: fixed; top: 90px; right: 24px; width: 360px; max-height: calc(100vh - 114px); overflow-y: auto; z-index: 10; background: rgba(22,22,28,0.88); backdrop-filter: blur(20px) saturate(1.3); border: 1px solid rgba(212,168,67,0.18); padding: 24px; display: none; flex-direction: column; gap: 12px; }
        .panel.open { display: flex; animation: panel-up 0.4s cubic-bezier(0.22,1,0.36,1) backwards; }
        .panel h2 { font-family: 'Fraunces', serif; font-size: 26px; font-style: italic; margin: 0 0 4px; color: #fff; }
        .panel .tag { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #D4A843; }
        .panel .places { list-style: none; padding: 0; margin: 8px 0 0; display: flex; flex-direction: column; gap: 8px; }
        .panel .places li { padding: 10px 12px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.06); font-size: 13px; line-height: 1.4; }
        .panel .places li a { color: #D4A843; text-decoration: none; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; display: inline-block; margin-top: 6px; }
        .panel .empty { color: #9A9AA8; font-size: 13px; }
        .panel .close { position: absolute; top: 12px; right: 12px; background: transparent; border: 1px solid rgba(212,168,67,0.28); color: #EDEEF2; width: 32px; height: 32px; cursor: pointer; }
        .hint { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 10; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #9A9AA8; background: rgba(11,11,15,0.7); padding: 8px 16px; border: 1px solid rgba(212,168,67,0.18); backdrop-filter: blur(12px); }
        .city-marker { width: 10px; height: 10px; background: #ff3b30; border: 2px solid #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(255,59,48,0.5); transition: transform 0.2s; }
        .city-marker:hover { transform: scale(1.4); box-shadow: 0 0 16px rgba(255,59,48,0.8); }
        .maplibregl-marker { padding: 3px; }
        @keyframes panel-in { from { opacity: 0; transform: translateY(14px) scale(0.97); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
        @keyframes panel-up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
        @media (max-width: 600px) {
            .topbar {
                padding: 10px 14px;
            }

            .topbar a {
                font-size: 8px;
                letter-spacing: 1.5px;
            }

            .topbar .title {
                font-size: 13px;
                letter-spacing: 0.5px;
                text-align: center;
            }

            .panel {
                top: auto;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                max-height: 62vh;
                border: none;
                border-top: 1px solid rgba(212,168,67,0.3);
                border-radius: 12px 12px 0 0;
                padding: 32px 16px 20px;
                gap: 8px;
            }

            .panel h2 {
                font-size: 22px;
                margin-top: 8px;
            }

            .panel .tag {
                font-size: 8px;
            }

            .panel .places {
                margin-top: 4px;
                gap: 6px;
            }

            .panel .places li {
                padding: 9px 11px;
                font-size: 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
            }

            .hint {
                bottom: auto;
                top: 64px;
                font-size: 7px;
                letter-spacing: 2px;
                padding: 5px 10px;
            }

            .city-marker {
                width: 14px;
                height: 14px;
                border-width: 2px;
            }
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="go-heritage.html">Back to GO HERITAGE</a>
        <div class="title">INTERACTIVE <span>3D</span> MAP</div>
        <div style="width: 140px;"></div>
    </div>
    <div id="map"></div>
    <div class="panel" id="panel">
        <button class="close" id="panelClose">X</button>
        <div class="tag" id="panelTag">City</div>
        <h2 id="panelTitle">-</h2>
        <div class="empty" id="panelDesc"></div>
        <div style="font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #D4A843; margin-top: 8px;">Places to visit</div>
        <ul class="places" id="panelPlaces"><li class="empty">Loading...</li></ul>
        <a id="panelLink" class="btn-primary" style="margin-top: 8px; text-align:center; display:none;" href="#">Explore city</a>
    </div>
    <div class="hint">Drag to pan - Scroll to zoom - Click a red marker</div>

    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <script>
    const FALLBACK_KEY = 'cb1_5cvq_1_8011f64c37add97cd443f4c3';
    const CITIES = [
        { name: "Bengaluru", slug: "bengaluru", lat: 12.9716, lng: 77.5946, tag: "Capital - Tech and Culture" },
        { name: "Mysuru", slug: "mysuru", lat: 12.3052, lng: 76.6552, tag: "Royal Heritage" },
        { name: "Vijayanagara", slug: "vijayanagara", lat: 15.3350, lng: 76.4600, tag: "UNESCO Ruins" },
        { name: "Shivamogga", slug: "shivamogga", lat: 13.9299, lng: 75.5681, tag: "Gateway to Malnad" },
        { name: "Udupi", slug: "udupi", lat: 13.3409, lng: 74.7421, tag: "Coastal Temple Town" },
        { name: "Kodagu", slug: "kodagu", lat: 12.4233, lng: 75.7394, tag: "Coffee Highlands" },
        { name: "Belagavi", slug: "belagavi", lat: 15.8497, lng: 74.4976, tag: "Border Fortress City" },
        { name: "Bagalkot", slug: "bagalkot", lat: 16.1862, lng: 75.6983, tag: "Chalukyan Heartland" },
        { name: "Vijayapura", slug: "vijayapura", lat: 16.8300, lng: 75.7100, tag: "Adil Shahi Legacy" },
        { name: "Hassan", slug: "hassan", lat: 13.0061, lng: 76.1029, tag: "Hoysala Temples" },
        { name: "Dharwad", slug: "dharwad", lat: 15.4559, lng: 75.0065, tag: "Cultural Capital" },
        { name: "Uttara Kannada", slug: "utter-kannada", lat: 14.8153, lng: 74.1233, tag: "Coastal Forests" },
        { name: "Chikkamagaluru", slug: "chikkamagaluru", lat: 13.3187, lng: 75.7716, tag: "Coffee and Peaks" },
        { name: "Dakshin Kannada", slug: "dakshin-kannada", lat: 12.9141, lng: 74.8560, tag: "Port and Temples" },
        { name: "Chitradurga", slug: "chitradurga", lat: 14.2300, lng: 76.3900, tag: "Fortress of Seven Rounds" }
    ];

    const panel = document.getElementById('panel');
    const panelTitle = document.getElementById('panelTitle');
    const panelTag = document.getElementById('panelTag');
    const panelPlaces = document.getElementById('panelPlaces');
    const panelLink = document.getElementById('panelLink');
    document.getElementById('panelClose').onclick = function(){ panel.classList.remove('open'); };

    async function loadPlaces(city) {
        panelPlaces.innerHTML = '<li class="empty">Loading places...</li>';
        panelLink.style.display = 'none';
        try {
            const res = await fetch('pages/' + city.slug + '.html');
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const titles = [...doc.querySelectorAll('.item-title')].map(function(e){ return e.textContent.trim(); }).filter(Boolean);
            if (titles.length) {
                panelPlaces.innerHTML = titles.map(function(t){
                    return '<li><a href="pages/' + city.slug + '.html#place-' + t.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '" style="color:#D4A843;text-decoration:none;letter-spacing:1px;">' + t + ' <span style="font-size:9px;opacity:0.7;">→</span></a></li>';
                }).join('');
            } else {
                panelPlaces.innerHTML = '<li class="empty">No places listed yet.</li>';
            }
        } catch (e) {
            panelPlaces.innerHTML = '<li class="empty">Could not load places.</li>';
        }
        panelLink.href = 'pages/' + city.slug + '.html';
        panelLink.style.display = 'block';
        panelLink.textContent = 'Explore ' + city.name;
    }

    function openPanel(city) {
        panelTag.textContent = city.tag;
        panelTitle.textContent = city.name;
        panel.classList.add('open');
        loadPlaces(city);
    }

    async function getCartoKey() {
        try {
            const r = await fetch('/api/carto-config');
            if (r.ok) { const d = await r.json(); if (d && d.apiKey) return d.apiKey; }
        } catch (e) {}
        return FALLBACK_KEY;
    }

    window.addEventListener('load', async function() {
        window.__loadFired = true;
        if (typeof maplibregl === 'undefined') { window.__noLib = true; return; }
        const key = await getCartoKey();
        const styleUrl = 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json?key=' + encodeURIComponent(key);
        const map = new maplibregl.Map({
            container: 'map',
            style: styleUrl,
            center: [75.7, 15.3],
            zoom: 6.5,
            pitch: 25,
            bearing: 0,
            antialias: true
        });
        window.__map = map;
        map.addControl(new maplibregl.NavigationControl(), 'top-left');
        CITIES.forEach(function(city) {
            const el = document.createElement('div');
            el.className = 'city-marker';
            new maplibregl.Marker({ element: el })
                .setLngLat([city.lng, city.lat])
                .addTo(map);
            el.addEventListener('click', function(){ openPanel(city); });
        });
        window.__markerCount = document.querySelectorAll('.city-marker').length;
        map.on('error', function(e){ window.__mapError = (e && e.error && e.error.message) || String(e); });
        map.on('idle', function(){ window.__idle = true; });
        map.on('sourcedata', function(){ window.__srcData = (window.__srcData||0)+1; });
        setTimeout(function(){ if(window.__map){ window.__after20 = { loaded: window.__map.loaded(), styleLoaded: window.__map.isStyleLoaded() }; } }, 20000);
    });
    </script>
</body>
</html>
